name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Build frontend
        run: pnpm --filter @tcd/web build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://test-company-docs.vercel.app' }}
          # Cloudflare Pages serves from the domain root (unlike GitHub
          # Pages' project-page subpath), so no VITE_BASE_PATH is needed.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=test-company-docs --branch=main
